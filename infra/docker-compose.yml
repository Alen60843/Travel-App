# Local development dependencies.
# PostGIS version is pinned: spatial index behaviour and function signatures
# differ across PostGIS majors, and the Phase 1 index benchmarks were taken
# on PostgreSQL 17 / PostGIS 3.6.
services:
  postgres:
    image: postgis/postgis:17-3.6
    environment:
      POSTGRES_USER: tripwith
      POSTGRES_PASSWORD: tripwith_local_dev
      POSTGRES_DB: tripwith
    ports:
      - '5432:5432'
    volumes:
      - tripwith_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tripwith -d tripwith']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - tripwith_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tripwith_pgdata:
  tripwith_redisdata:
