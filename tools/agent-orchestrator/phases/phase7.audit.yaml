# smallest missing Phase 7 capabilities, and derive the implementation DAG.
# Graph Context v1 is intentionally dogfooded here: the task names only a few
# semantic/file seeds and expects the resolver + agent evidence discipline to
# discover the directly relevant neighborhood.

phase: "7-audit"
name: Phase 7 Chat & Realtime — pre-implementation audit
